
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}
#status {
    text-align: center;
}
</style>
</head>
<body>

<div id="status">Loading game...</div>

<script>
(async () => {
    const SOURCE = "https://subwaysurfers.holdenfernandesss.workers.dev/";

    try {
        const response = await fetch(SOURCE);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const html = await response.text();

        if (!html.trim()) {
            throw new Error("The file is empty.");
        }

        document.open();
        document.write(html);
        document.close();

    } catch (error) {
        document.getElementById("status").textContent =
            "Failed to load: " + error.message;
    }
})();
</script>

</body>
</html>
